<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5K DISPLAY — MAJENE RUN 2026</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body id="chromaBody" class="chroma-body hide-cursor">
  <div class="chroma-timer-container">
    <div id="chromaLabel" class="chroma-label" style="display: none;">5K</div>
    <div id="timerDisplay" class="chroma-timer-text">00:00:00</div>
  </div>

  <script>
    const socket = io();
    let currentRace = null;
    let systemState = null;
    let animFrameId = null;

    function formatHHMMSS(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function calculateElapsed(race, nowMs) {
      if (!race || race.status === 'idle' || race.status === 'armed' || !race.startedAt) return 0;
      if (race.status === 'finished' && race.finishedElapsedMs !== null) return Math.max(0, race.finishedElapsedMs);
      if (race.status === 'paused' && race.pausedAt) {
        return Math.max(0, race.pausedAt - race.startedAt - race.accumulatedPauseMs + race.adjustmentMs);
      }
      if (race.status === 'finished' && race.finishedAt) {
        return Math.max(0, race.finishedAt - race.startedAt - race.accumulatedPauseMs + race.adjustmentMs);
      }
      return Math.max(0, nowMs - race.startedAt - race.accumulatedPauseMs + race.adjustmentMs);
    }

    function applyVisualEffects(timerEl, ds) {
      if (!ds) return;

      // 1. Color & Scale
      timerEl.style.color = ds.textColor || '#FFFFFF';

      // 2. Stroke / Outline
      if (ds.strokeWidth && ds.strokeWidth > 0) {
        timerEl.style.webkitTextStroke = `${ds.strokeWidth}px ${ds.strokeColor || '#000000'}`;
      } else {
        timerEl.style.webkitTextStroke = '0px transparent';
      }

      // 3. Shadow & Glow Effects
      const shadows = [];
      if (ds.shadowBlur && ds.shadowBlur > 0) {
        shadows.push(`4px 6px ${ds.shadowBlur}px ${ds.shadowColor || '#000000'}`);
      }
      if (ds.glowBlur && ds.glowBlur > 0) {
        shadows.push(`0 0 ${ds.glowBlur}px ${ds.glowColor || '#00FFFF'}`);
        shadows.push(`0 0 ${Math.round(ds.glowBlur * 1.5)}px ${ds.glowColor || '#00FFFF'}`);
      }
      timerEl.style.textShadow = shadows.length > 0 ? shadows.join(', ') : 'none';

      // 4. Background Box Overlay (opsional jika dibutuhkan di background kontras)
      if (ds.bgBoxEnabled) {
        timerEl.style.backgroundColor = ds.bgBoxColor || 'rgba(0,0,0,0.6)';
        timerEl.style.padding = '0.1em 0.3em';
        timerEl.style.borderRadius = '0.15em';
      } else {
        timerEl.style.backgroundColor = 'transparent';
        timerEl.style.padding = '0';
        timerEl.style.borderRadius = '0';
      }

      // 5. Scale
      if (ds.scalePercent) {
        timerEl.style.transform = `scale(${ds.scalePercent / 100})`;
      }
    }

    function renderLoop() {
      const timerEl = document.getElementById('timerDisplay');
      const bodyEl = document.getElementById('chromaBody');
      const labelEl = document.getElementById('chromaLabel');

      if (systemState) {
        const ds = systemState.displaySettings;
        bodyEl.style.backgroundColor = ds.chromaColor || '#00FF00';
        labelEl.style.color = ds.textColor || '#FFFFFF';

        if (ds.hideCursor) {
          bodyEl.classList.add('hide-cursor');
        } else {
          bodyEl.classList.remove('hide-cursor');
        }

        if (ds.showLabel) {
          labelEl.style.display = 'block';
        } else {
          labelEl.style.display = 'none';
        }

        applyVisualEffects(timerEl, ds);

        if (systemState.chromaTestOnly) {
          timerEl.style.display = 'none';
          labelEl.style.display = 'none';
          animFrameId = requestAnimationFrame(renderLoop);
          return;
        } else {
          timerEl.style.display = 'block';
        }

        if (systemState.testPattern && systemState.testPattern !== 'none') {
          timerEl.innerText = systemState.testPattern;
          animFrameId = requestAnimationFrame(renderLoop);
          return;
        }
      }

      if (currentRace) {
        const elapsed = calculateElapsed(currentRace, Date.now());
        timerEl.innerText = formatHHMMSS(elapsed);
      }

      animFrameId = requestAnimationFrame(renderLoop);
    }

    socket.on('STATE_UPDATE', (data) => {
      if (data && data.races) {
        currentRace = data.races['5k'];
        systemState = data.system;
      }
    });

    socket.emit('GET_STATE');
    renderLoop();
  </script>
</body>
</html>
