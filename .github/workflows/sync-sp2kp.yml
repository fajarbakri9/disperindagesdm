name: Sinkronisasi Harga SP2KP

on:
  schedule:
    # 22:35 WITA; satu run harian menjaga pemakaian Actions/Firestore tetap kecil.
    - cron: "35 14 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Tanggal SP2KP (YYYY-MM-DD); kosong berarti hari ini"
        required: false
        type: string

concurrency:
  group: sp2kp-production-sync
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: vars.MI_WIF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/collector/requirements.txt

      - name: Authenticate with keyless WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MI_SERVICE_ACCOUNT }}

      - name: Install pinned dependencies
        run: pip install -r engine/collector/requirements.txt

      - name: Verify fail-closed synchronizer
        run: python -m pytest engine/tests/test_sp2kp_sync.py -q

      - name: Publish exact-date SP2KP snapshot
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          args=(--live)
          if [[ -n "$TARGET_DATE" ]]; then
            args+=(--date "$TARGET_DATE")
          fi
          python scripts/sync_sp2kp.py "${args[@]}"
