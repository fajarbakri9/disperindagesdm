name: Sync SBL Ekraf monthly aggregate

on:
  schedule:
    - cron: "17 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_sbl_ekraf.py
      - name: Commit changed aggregate
        run: |
          git config user.name "disperindag-data-bot"
          git config user.email "disperindag-data-bot@users.noreply.github.com"
          git add assets/data/sbl-ekraf-monthly.json
          git diff --cached --quiet || git commit -m "data: refresh monthly SBL Ekraf aggregate"
          git push
