name: Media Intelligence Private Backup

on:
  schedule:
    - cron: "40 18 * * 0"
  workflow_dispatch:

concurrency:
  group: media-intelligence-backup-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    if: vars.MI_WIF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/collector/requirements.txt

      - name: Authenticate through restricted WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MI_SERVICE_ACCOUNT }}

      - name: Install pinned dependencies
        run: pip install -r engine/collector/requirements.txt

      - name: Create compressed JSON backup
        run: python engine/operations/backup_firestore.py --output "backup/mi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json.gz"

      - name: Upload private short-retention artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-intelligence-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backup/*.json.gz
            backup/*.manifest.json
          if-no-files-found: error
          retention-days: 30
