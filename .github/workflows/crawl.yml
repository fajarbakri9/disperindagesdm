name: Media Intelligence Crawl

on:
  schedule:
    # 02:17, 06:17, 10:17, 14:17, 18:17, dan 22:17 WITA.
    - cron: "17 2,6,10,14,18,22 * * *"
  workflow_dispatch:

concurrency:
  group: media-intelligence-crawl-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  crawl:
    if: vars.MI_WIF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      PYTHONPATH: engine
      MI_TRIGGER: github_actions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/collector/requirements.txt

      - name: Authenticate through restricted WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MI_SERVICE_ACCOUNT }}

      - name: Install pinned dependencies
        run: pip install -r engine/collector/requirements.txt

      - name: Run collector tests
        run: python -m pytest engine/tests -q

      - name: Collect, validate, and publish snapshot
        run: python engine/collector/main.py --trigger github_actions
