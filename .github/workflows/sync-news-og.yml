name: Sinkronisasi Berita dan Open Graph

on:
  schedule:
    # 02:27, 06:27, 10:27, 14:27, 18:27, dan 22:27 WITA.
    - cron: "27 2,6,10,14,18,22 * * *"
  workflow_dispatch:

concurrency:
  group: firebase-news-og-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    if: vars.MI_WIF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Autentikasi Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MI_SERVICE_ACCOUNT }}

      - name: Build artikel, gambar OG, dan sitemap
        run: python build_static_pages.py --cloud

      - name: Validasi hasil build
        shell: bash
        run: |
          python -m py_compile build_static_pages.py
          node --check js/admin.js
          node --check js/data.js
          test -s sitemap.xml
          grep -q 'application/ld+json' berita/*/index.html

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.18.0

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
