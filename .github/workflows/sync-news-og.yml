name: Sinkronisasi Berita dan Open Graph

on:
  schedule:
    # 02:27, 06:27, 10:27, 14:27, 18:27, dan 22:27 WITA.
    - cron: "27 2,6,10,14,18,22 * * *"
  workflow_dispatch:

concurrency:
  group: firebase-news-og-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    # Pengaman sementara: checkout GitHub belum memuat seluruh master portal.
    # Jangan menjalankan build maupun publikasi dari jadwal otomatis. Aktifkan
    # kembali hanya setelah baseline produksi lengkap sudah dikomit.
    if: github.event_name == 'workflow_dispatch' && vars.MI_WIF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Verifikasi checkout bersih dan secret scan
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          if git grep -n -I -E "BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|private_key|client_secret|service_account" HEAD -- ":!*.md" ":!*.html" ":!assets/**"; then
            echo "Credential pattern detected in repository history" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Autentikasi Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MI_SERVICE_ACCOUNT }}

      - name: Build artikel, gambar OG, dan sitemap
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: python scripts/build_production.py

      - name: Validasi hasil build
        shell: bash
        run: |
          python -m py_compile build_static_pages.py scripts/build_production.py
          node --check js/admin.js
          node --check js/data.js
          test -s dist/sitemap.xml
          grep -R -q 'application/ld+json' dist/berita/*/index.html
          test -s dist/direktori-lpg.html
          test -s dist/penyalur-bbm.html
          test -s dist/peta-gis.html
          test -s dist/js/lpg-engine.js
          test -s dist/js/bbm-engine.js
          test -s dist/js/market-engine.js
          grep -q '2026-08-31-lpg-agent-coordinates-v2' dist/js/lpg-engine.js
          grep -q '2026-08-31-bbm-single-source-v1' dist/js/bbm-engine.js
          grep -q '2026-08-31-market-single-source-v3' dist/js/market-engine.js

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.18.0

      - name: Deploy Firebase Hosting
        # Jadwal otomatis hanya membangun dan memvalidasi. Publikasi produksi
        # harus dipicu manual setelah master portal terbaru ada di repository,
        # agar checkout lama tidak menimpa hosting dengan fallback lama.
        if: github.event_name == 'workflow_dispatch'
        run: firebase deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
