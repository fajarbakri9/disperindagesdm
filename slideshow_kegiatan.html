    <!-- Web Audio Synthesizer Background Ambient Sound (No external asset needed) -->
    <script>
        // Web Audio Synthesizer ambient soothing sound
        let audioCtx = null;
        let isAudioPlaying = true;
        let bgOscillator = null;
        let bgGain = null;

        function initAudioSynthesizer() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                
                bgGain = audioCtx.createGain();
                bgGain.gain.setValueAtTime(0.05, audioCtx.currentTime);

                bgOscillator = audioCtx.createOscillator();
                bgOscillator.type = 'sine';
                bgOscillator.frequency.setValueAtTime(220, audioCtx.currentTime); // A3 note
                
                bgOscillator.connect(bgGain);
                bgGain.connect(audioCtx.destination);
                bgOscillator.start();
            } catch(e) {
                console.log('Audio Autoplay policy:', e);
            }
        }

        function toggleAudioBg() {
            const icon = document.getElementById('icon-music');
            const text = document.getElementById('text-music');
            if (isAudioPlaying) {
                if (bgGain && audioCtx) bgGain.gain.setValueAtTime(0, audioCtx.currentTime);
                isAudioPlaying = false;
                icon.setAttribute('data-lucide', 'volume-x');
                text.innerText = 'Musik: OFF';
            } else {
                if (!audioCtx) initAudioSynthesizer();
                if (bgGain && audioCtx) bgGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                isAudioPlaying = true;
                icon.setAttribute('data-lucide', 'music');
                text.innerText = 'Musik: ON';
            }
            lucide.createIcons();
        }
    </script>

            lucide.createIcons();
        }

        function updateSlideInfo(idx) {
            const slide = SLIDES[idx];
            badgeEl.innerHTML = `<i data-lucide="sparkles" size="13"></i> ${slide.category}`;
            titleEl.innerText = slide.title;
            counterEl.innerText = `Slide ${idx + 1} dari ${SLIDES.length}`;

            // Highlight thumbnail
            document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
            const activeThumb = document.getElementById(`thumb-item-${idx}`);
            if (activeThumb) {
                activeThumb.classList.add('active');
                activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            lucide.createIcons();
        }

        function goToSlide(targetIdx) {
            if (targetIdx === currentIndex) return;

            const oldLayer = document.getElementById(`slide-layer-${currentIndex}`);
            if (oldLayer) {
                oldLayer.classList.remove('active', 'kenburns');
            }

            currentIndex = targetIdx;
            if (currentIndex >= SLIDES.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = SLIDES.length - 1;

            const newLayer = document.getElementById(`slide-layer-${currentIndex}`);
            if (newLayer) {
                newLayer.classList.add('active', 'kenburns');
            }

            updateSlideInfo(currentIndex);
            resetProgressBar();
        }

        function nextSlide() {
            let target = currentIndex + 1;
            if (target >= SLIDES.length) target = 0;
            goToSlide(target);
        }

        function prevSlide() {
            let target = currentIndex - 1;
            if (target < 0) target = SLIDES.length - 1;
            goToSlide(target);
        }

        function startAutoPlay() {
            if (slideTimer) clearInterval(slideTimer);
            if (progressTimer) clearInterval(progressTimer);

            progressStartTime = performance.now();
            
            progressTimer = setInterval(() => {
                const elapsed = performance.now() - progressStartTime;
                const pct = Math.min((elapsed / SLIDE_DURATION) * 100, 100);
                progressBarEl.style.width = `${pct}%`;
            }, 50);

            slideTimer = setInterval(() => {
                nextSlide();
            }, SLIDE_DURATION);
        }

        function resetProgressBar() {
            progressBarEl.style.width = '0%';
            progressStartTime = performance.now();
        }

        function togglePlayPause() {
            const icon = document.getElementById('icon-play-pause');
            const text = document.getElementById('text-play-pause');

            if (isPlaying) {
                clearInterval(slideTimer);
                clearInterval(progressTimer);
                isPlaying = false;
                icon.setAttribute('data-lucide', 'play');
                text.innerText = 'Putar Slideshow';
            } else {
                isPlaying = true;
                startAutoPlay();
                icon.setAttribute('data-lucide', 'pause');
                text.innerText = 'Jeda Slideshow';
            }
            lucide.createIcons();
        }

        function toggleFullscreen() {
            const container = document.getElementById('showcase-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Keyboard Shortcut Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        // Initialize On Load
        window.onload = () => {
            initShowcase();
            initAudioSynthesizer();
        };
    </script>
</body>
</html>
