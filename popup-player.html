<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player 92.4 FM — LPPL Suara Bumi Lasinrang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(145deg, #070a13 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            text-align: center;
            overflow-x: hidden;
        }
        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .header-brand img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }
        .header-brand h4 {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            line-height: 1.1;
            color: #fff;
        }
        .header-brand span {
            font-size: 0.72rem;
            color: #38bdf8;
            font-weight: 700;
        }
        .live-tag {
            background: #ef4444;
            color: #fff;
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.05em;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .station-hero {
            padding: 24px 10px 16px;
        }
        .tagline {
            font-size: 0.75rem;
            font-weight: 800;
            color: #f59e0b;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .program-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.25;
        }
        .host-name {
            font-size: 0.88rem;
            color: #94a3b8;
            margin-bottom: 18px;
        }
        .host-name strong {
            color: #38bdf8;
        }
        
        /* Audio Spectrum Bars */
        .spectrum-box {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 36px;
            margin-bottom: 20px;
        }
        .spec-bar {
            width: 5px;
            height: 8px;
            background: #0284c7;
            border-radius: 4px;
            transition: height 0.15s ease;
        }
        .playing .spec-bar {
            background: linear-gradient(180deg, #38bdf8, #0284c7);
            animation: bounce 0.6s infinite alternate ease-in-out;
        }
        .playing .spec-bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .spec-bar:nth-child(2) { animation-delay: 0.3s; }
        .playing .spec-bar:nth-child(3) { animation-delay: 0.5s; }
        .playing .spec-bar:nth-child(4) { animation-delay: 0.2s; }
        .playing .spec-bar:nth-child(5) { animation-delay: 0.4s; }
        .playing .spec-bar:nth-child(6) { animation-delay: 0.15s; }
        .playing .spec-bar:nth-child(7) { animation-delay: 0.35s; }

        @keyframes bounce {
            from { height: 6px; }
            to { height: 32px; }
        }

        /* Controls */
        .play-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.5);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .play-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.7);
        }
        .volume-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .volume-slider {
            width: 140px;
            accent-color: #0284c7;
            cursor: pointer;
        }
        .btn-wa-req {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s ease;
        }
        .btn-wa-req:hover {
            transform: translateY(-2px);
            background: #059669;
        }
        .player-footer {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
            font-size: 0.72rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="player-header">
        <div class="header-brand">
            <img src="assets/images/logo-sbl-square.png" alt="SBL 92.4 FM" onerror="this.src='https://sbl.pinrangkab.go.id/wp-content/themes/sbl-web2/assets/images/logo-sbl-square.png'">
            <div>
                <h4>RADIO SBL</h4>
                <span>92.40 MHz FM</span>
            </div>
        </div>
        <div class="live-tag">● ON AIR</div>
    </div>

    <div class="station-hero">
        <p class="tagline">SUARA PINRANG, SUARA KITA!</p>
        <h2 class="program-name" id="popup-program">Salam Bumi Lasinrang</h2>
        <p class="host-name">🎙️ Bersama: <strong id="popup-host">Penyiar Studio SBL</strong></p>

        <div class="spectrum-box" id="spectrum">
            <div class="spec-bar"></div>
            <div class="spec-bar"></div>
            <div class="spec-bar"></div>
            <div class="spec-bar"></div>
            <div class="spec-bar"></div>
            <div class="spec-bar"></div>
            <div class="spec-bar"></div>
        </div>

        <button class="play-btn" id="popup-play-btn" title="Putar / Jeda">▶</button>

        <div class="volume-wrap">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="popup-vol" min="0" max="1" step="0.05" value="0.9" title="Volume">
        </div>

        <a href="https://wa.me/6285122561992?text=Halo%20Radio%20SBL%2092.4%20FM,%20saya%20sedang%20mendengarkan%20live%20streaming..." target="_blank" class="btn-wa-req">
            💬 Kirim Salam & Request ke Studio WA
        </a>
    </div>

    <div class="player-footer">
        Studio LPPL Radio Suara Bumi Lasinrang • Kab. Pinrang
    </div>

    <script>
        const STREAM_URL = 'https://pu.klikhost.com/proxy/sbl/stream';
        const audio = new Audio(STREAM_URL);
        const playBtn = document.getElementById('popup-play-btn');
        const spectrum = document.getElementById('spectrum');
        const volSlider = document.getElementById('popup-vol');
        let isPlaying = false;

        // Auto calculate program by WITA time
        function updateOnAirProgram() {
            const now = new Date();
            // Convert to WITA (UTC+8)
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const witaTime = new Date(utc + (3600000 * 8));
            const hours = witaTime.getHours();
            const day = witaTime.getDay(); // 0: Min, 1: Sen, ...

            let prog = 'Siaran Relaksasi Musik Pinrang';
            let host = 'Auto Music System';

            if (hours >= 5 && hours < 7) {
                prog = 'Salam Subuh Bumi Lasinrang';
                host = 'Tausiah & Kabar Subuh';
            } else if (hours >= 7 && hours < 8) {
                prog = 'Semangat Pagi Lasinrang';
                host = 'Transisi Playlist';
            } else if (hours >= 8 && hours < 10) {
                prog = 'Salam Bumi Lasinrang';
                host = (day === 1 || day === 3 || day === 4) ? 'Amar' : (day === 2 || day === 5 || day === 0) ? 'Ria' : 'Wiwik';
            } else if (hours >= 10 && hours < 12) {
                prog = 'Lasinrang Preneur & UMKM';
                host = 'Kak Azhar & Maya';
            } else if (hours >= 12 && hours < 14) {
                prog = 'Keluarga Berdaya & Edukasi';
                host = 'Redaksi SBL';
            } else if (hours >= 14 && hours < 16) {
                prog = 'Informasi Seputar Pinrang';
                host = (day === 1 || day === 2 || day === 6 || day === 0) ? 'Wiwik' : 'Miah';
            } else if (hours >= 16 && hours < 18) {
                prog = 'Kompak / Pinrang KEREN!';
                host = (day === 3 || day === 4) ? 'Amar & Riska' : 'Miah';
            } else if (hours >= 18 && hours < 20) {
                prog = 'Program Religi & Tausiah';
                host = 'Lagu & Nada Islami';
            } else if (hours >= 20 && hours < 22) {
                prog = 'Aga Kareba / SBL on Stage';
                host = 'Sul';
            } else {
                prog = 'Lagu-Lagu Terbaik Bumi Lasinrang';
                host = 'Night Playlist';
            }

            document.getElementById('popup-program').innerText = prog;
            document.getElementById('popup-host').innerText = host;
        }

        updateOnAirProgram();
        setInterval(updateOnAirProgram, 60000);

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerHTML = '▶';
                spectrum.classList.remove('playing');
            } else {
                audio.play().then(() => {
                    isPlaying = true;
                    playBtn.innerHTML = '⏸';
                    spectrum.classList.add('playing');
                }).catch(e => {
                    console.error('Play error', e);
                });
            }
        }

        playBtn.addEventListener('click', togglePlay);
        volSlider.addEventListener('input', e => {
            audio.volume = parseFloat(e.target.value);
        });

        // Auto play on open if user initiated
        togglePlay();
    </script>
</body>
</html>
