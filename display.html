<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videotron Display - LyricVideo Sing-Along</title>
    <meta name="description" content="Layar Tampilan Videotron Fullscreen 60FPS untuk Live Sing-Along Penonton">
    
    <!-- Google Fonts dengan Safe System Fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;600;800&family=Montserrat:wght@400;700;900&family=Outfit:wght@400;600;800;900&family=Playfair+Display:ital,wght@0,600;0,900;1,400&family=Poppins:wght@400;600;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #041622;
            font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #videotronCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
            object-fit: fill;
            cursor: pointer;
        }

        .fullscreen-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(4, 22, 34, 0.85);
            color: #D6D58E;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.82rem;
            border: 1px solid rgba(230, 57, 38, 0.4);
            pointer-events: none;
            opacity: 0.9;
            transition: opacity 1s ease;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="fullscreen-hint" id="fsHint">Tekan F11 untuk Fullscreen Videotron</div>
    <canvas id="videotronCanvas" width="1920" height="1080"></canvas>

    <video id="bgVideoElement" loop muted playsinline style="display:none;"></video>

    <script src="display.js"></script>
</body>
</html>
