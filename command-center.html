<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Command Center | Disperindag ESDM Kabupaten Pinrang</title>
    <meta
      name="description"
      content="Command Center terpadu perdagangan, industri, energi, metrologi dan GIS e-SKPT Kabupaten Pinrang."
    />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="assets/brand/logo_pinrang_opt.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
    <link
      rel="stylesheet"
      href="css/command-center.css?v=20260929_redesign_v1"
    />
  </head>
  <body>
    <header class="cc-header">
      <a
        class="cc-brand"
        href="index.html"
        aria-label="Kembali ke portal utama"
      >
        <span class="cc-seal"
          ><img
            src="assets/brand/Logo_Pinrang_HD.png"
            alt="Lambang resmi Kabupaten Pinrang"
        /></span>
        <span
          ><strong>COMMAND CENTER</strong
          ><small>DISPERINDAG ESDM KABUPATEN PINRANG</small></span
        >
      </a>
      <div class="cc-head-tools">
        <span class="cc-source-pill">DATA OPERASIONAL TERINTEGRASI</span>
        <time class="cc-date" id="ccLiveDate">—</time>
        <time class="cc-time" id="ccLiveTime"
          >00:00:00 <small>WITA</small></time
        >
        <span class="cc-live-badge status-loading" id="systemLiveBadge"
          ><i></i><span>MEMUAT</span><small>Sistem sinkron</small></span
        >
        <button
          class="icon-btn"
          id="ccSearch"
          type="button"
          title="Cari data"
          aria-label="Cari data"
        >
          <i data-lucide="search"></i>
        </button>
        <button
          class="icon-btn"
          id="btnFullscreen"
          type="button"
          title="Layar penuh"
          aria-label="Layar penuh"
        >
          <i data-lucide="maximize"></i>
        </button>
        <button
          class="icon-btn"
          id="btnSettings"
          type="button"
          title="Jeda rotasi"
          aria-label="Jeda rotasi"
        >
          <i data-lucide="settings"></i>
        </button>
      </div>
    </header>

    <nav class="cc-nav" aria-label="Modul Command Center">
      <button class="cc-tab active" data-slide="overview">
        <i data-lucide="layout-grid"></i><span>IKHTISAR</span>
      </button>
      <button class="cc-tab" data-slide="market">
        <i data-lucide="store"></i><span>PASAR</span>
      </button>
      <button class="cc-tab" data-slide="metrology">
        <i data-lucide="scale"></i><span>METROLOGI</span>
      </button>
      <button class="cc-tab" data-slide="esdm">
        <i data-lucide="zap"></i><span>ESDM</span>
      </button>
      <button class="cc-tab" data-slide="industry">
        <i data-lucide="factory"></i><span>INDUSTRI &amp; EKRAF</span>
      </button>
      <button class="cc-tab" data-slide="fuel">
        <i data-lucide="fuel"></i><span>BBM</span>
      </button>
      <button class="cc-tab" data-slide="gis">
        <i data-lucide="map"></i><span>GIS</span>
      </button>
    </nav>

    <main class="cc-main" id="ccMain" aria-live="polite"></main>

    <footer class="cc-ticker">
      <strong>INFO TERKINI</strong>
      <div class="ticker-items" id="ccTickerText"></div>
      <time id="ccFooterTime">00:00</time>
    </footer>

    <template id="standardPageTemplate">
      <section class="dashboard-page"></section>
    </template>

    <div class="cc-command" id="ccCommand" hidden>
      <button
        class="command-backdrop"
        data-close-command
        aria-label="Tutup pencarian"
      ></button>
      <form class="command-box" id="ccCommandForm">
        <i data-lucide="search"></i
        ><input
          id="ccCommandInput"
          placeholder="Cari modul atau data…"
          autocomplete="off"
        /><kbd>ESC</kbd>
        <div id="ccCommandResults"></div>
      </form>
    </div>

    <div
      class="cc-detail"
      id="ccDetail"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="ccDetailTitle"
    >
      <button
        class="detail-backdrop"
        type="button"
        data-close-detail
        aria-label="Tutup detail"
      ></button>
      <article class="detail-dialog">
        <header>
          <span class="detail-icon"
            ><i data-lucide="chart-no-axes-combined"></i
          ></span>
          <div>
            <small id="ccDetailEyebrow">DETAIL INDIKATOR</small>
            <h2 id="ccDetailTitle">Detail data</h2>
          </div>
          <button type="button" data-close-detail aria-label="Tutup detail">
            <i data-lucide="x"></i>
          </button>
        </header>
        <div class="detail-body" id="ccDetailBody"></div>
        <footer>
          <span
            ><i data-lucide="shield-check"></i> Data ditampilkan sesuai sumber
            aktif</span
          ><button type="button" data-close-detail>Tutup</button>
        </footer>
      </article>
    </div>

    <div class="sr-only" aria-hidden="true">
      <span id="ccMiMentions24h">—</span><span id="ccMiUniqueStories">—</span
      ><span id="ccMiCriticalIssues">—</span><span id="ccMiLastSync">—</span
      ><span id="ccMiStatus">—</span>
    </div>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js?v=20260831_cc_gis_sync_v2"></script>
    <script src="js/e-skpt-market-engine.js?v=20260929_command_center_v1"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="js/command-center.js?v=20261007_lpg_september_v1"></script>
  </body>
</html>
