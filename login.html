  <style>
    .login-container-wrapper {
      min-height: 100vh;
      background: radial-gradient(circle at top, #0F2C59 0%, #030D1B 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 2px solid var(--accent-gold);
      overflow: hidden;
    }
    .login-header-banner {
      background: var(--primary-gradient);
      padding: 30px 24px;
      text-align: center;
      color: #FFFFFF;
      border-bottom: 2px solid var(--accent-gold);
    }
    .login-header-banner img { display: block; margin-left: auto; margin-right: auto;
      width: 64px;
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
    @media screen and (max-width: 768px) and (orientation: portrait) {
      .login-container-wrapper { padding: 16px 12px; align-items: flex-start; }
      .login-box-card { max-width: 420px; margin-top: 4vh; border-width: 1px; border-radius: 18px; }
      .login-header-banner { padding: 24px 18px 22px; }
      .login-header-banner img { display: block; margin-left: auto; margin-right: auto; width: 58px; margin-bottom: 9px; }
      .login-box-card > div[style*="padding: 32px"] { padding: 24px 18px !important; }
      #systemLoginForm { gap: 15px !important; }
      .login-box-card input.form-input { min-height: 44px; box-sizing: border-box; }
    }  </style>

<body>

  <div class="login-container-wrapper">
    <div class="login-box-card">
      
      <!-- Header Banner -->
      <div class="login-header-banner">
        <img src="assets/brand/logo_pinrang_opt.png" alt="Logo Pemkab Pinrang">
        <h2 style="font-size: 1.25rem; font-weight: 800; color: #FFFFFF; line-height: 1.3;">DISPERINDAG ESDM</h2>
        <p style="font-size: 0.8rem; color: var(--accent-gold); font-weight: 700; letter-spacing: 0.05em;">KABUPATEN PINRANG</p>
        <div style="font-size: 0.76rem; color: #CBD5E1; margin-top: 8px;">Portal Akses Pegawai & Administrator</div>
      </div>

      <!-- Form Login Resmi -->
      <div style="padding: 32px 28px;">
        
        <div id="loginAlertBox" style="display: none; padding: 12px; border-radius: 8px; font-size: 0.84rem; margin-bottom: 20px; line-height: 1.45;"></div>

        <form id="systemLoginForm" style="display: flex; flex-direction: column; gap: 18px;">
          <div>
            <label class="form-label" for="loginUsername" style="font-size: 0.88rem;">Email Firebase Resmi</label>
            <input type="email" id="loginUsername" class="form-input" required placeholder="nama@instansi.go.id" style="padding: 12px 14px;" autocomplete="username">
          </div>

          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" for="loginPassword" style="margin-bottom: 0; font-size: 0.88rem;">Kata Sandi (Password)</label>
              <a href="#" onclick="showForgotPwdModal(); return false;" style="font-size: 0.76rem; color: #1D4ED8; text-decoration: none; font-weight: 700;">Lupa Sandi?</a>
            </div>
            <input type="password" id="loginPassword" class="form-input" required placeholder="••••••••••••" style="padding: 12px 14px;" autocomplete="current-password">
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; color: #475569;">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
              <input type="checkbox" id="rememberMe"> Ingat sesi masuk saya
            </label>
          </div>

          <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 1rem; font-weight: 800; margin-top: 6px;">
            <span>🔐</span> Masuk ke Sistem ASN
          </button>
        </form>

        <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid #F1F5F9; text-align: center;">
          <a href="index.html" style="color: #64748B; font-size: 0.84rem; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
            &larr; Kembali ke Beranda Portal Publik
          </a>
        </div>

      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=20260830_firebase_auth_v1"></script>
  <script src="js/data.js?v=20260829_sync15_v1"></script>
  <script src="js/modal-system.js?v=20260829_sync15_v1"></script>
  <script src="js/auth.js?v=20260830_auth_integrity_v2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Periksa apakah sudah ada sesi login aktif
      const session = getCurrentSession();
      if (session) {
        if (session.canAccessAdmin) {
          window.location.href = "admin.html";
        } else if (session.canAccessLpgAgen) {
          window.location.href = "lpg-agen.html";
        } else {
          window.location.href = "petugas.html";
        }
        return;
      }

      const form = document.getElementById('systemLoginForm');
      const alertBox = document.getElementById('loginAlertBox');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('loginUsername').value;
        const p = document.getElementById('loginPassword').value;

        const authResult = await authenticateFirebaseUser(u, p);
        if (authResult.success) {
          alertBox.style.display = 'block';
          alertBox.style.background = '#ECFDF5';
          alertBox.style.border = '1px solid #A7F3D0';
          alertBox.style.color = '#065F46';
          alertBox.innerHTML = `✓ Otentikasi Berhasil! Mengalihkan ke sistem...`;

          setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = getSafeInternalRedirect(urlParams.get('redirect'));
            if (redirect) {
              window.location.href = redirect;
            } else if (authResult.user.canAccessAdmin) {
              window.location.href = "admin.html";
            } else if (authResult.user.canAccessLpgAgen) {
              window.location.href = "lpg-agen.html";
            } else {
              window.location.href = "petugas.html";
            }
          }, 600);
        } else {
          alertBox.style.display = 'block';
          alertBox.style.background = '#FEF2F2';
          alertBox.style.border = '1px solid #FECACA';
          alertBox.style.color = '#991B1B';
          alertBox.innerHTML = `⚠️ ${authResult.message}`;
        }
      });
    });

    function getSafeInternalRedirect(value) {
      if (!value || typeof value !== 'string') return null;
      try {
        const target = new URL(value, window.location.origin);
        if (target.origin !== window.location.origin) return null;
        if (!target.pathname.startsWith('/')) return null;
        return `${target.pathname}${target.search}${target.hash}`;
      } catch (error) {
        return null;
      }
    }

    function showForgotPwdModal() {
      CustomModal.alert({
        title: "Pemulihan Kata Sandi",
        message: "Untuk alasan keamanan sistem dan perlindungan akun ASN, pemulihan kata sandi dilakukan melalui <strong>Subbagian Umum, Kepegawaian dan Hukum Disperindag ESDM Pinrang</strong> atau hubungi Admin IT di (0421) 921215.",
        icon: "🛡️",
        type: "info"
      });
    }
  </script>
