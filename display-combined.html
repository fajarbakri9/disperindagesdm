<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMBINED 5K & 10K DISPLAY — MAJENE RUN 2026</title>
  <!-- Google Fonts: Pilihan Font Timer Resmi -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:wght@700&family=Exo+2:wght@900&family=Orbitron:wght@700;900&family=Rajdhani:wght@700&family=Roboto+Mono:wght@700&family=Share+Tech+Mono&family=Black+Ops+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #00FF00; /* Default Chroma Green */
      font-family: 'Orbitron', sans-serif;
      user-select: none;
      box-sizing: border-box;
    }

    .hide-cursor {
      cursor: none;
    }

    /* Container Pembagi Layar 2 Horizontal: Atas (5K) & Bawah (10K) */
    .combined-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding: 1.5vh 2vw;
      gap: 1vh; /* Jarak rapat & proporsional antara 5K dan 10K */
    }

    /* Sektor Kategori */
    .race-sector {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 3vw;
      box-sizing: border-box;
      padding: 0.5vh 1vw;
    }

    .sector-5k {
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    .category-badge {
      font-size: clamp(28px, 4.5vw, 85px);
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-shadow: 0 4px 16px rgba(0,0,0,0.8);
      min-width: 2.2em;
      text-align: right;
    }

    .badge-5k {
      color: #60A5FA; /* Biru Neon */
    }

    .badge-10k {
      color: #C084FC; /* Ungu Neon */
    }

    .timer-digits {
      font-size: clamp(54px, 12.5vw, 220px);
      font-weight: 900;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
      transition: color 0.15s ease, text-shadow 0.15s ease;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body id="chromaBody" class="chroma-body hide-cursor">
  
  <div class="combined-container">
    <!-- BAGIAN ATAS: KATEGORI 5K -->
    <div class="race-sector sector-5k">
      <div id="label5K" class="category-badge badge-5k">5K</div>
      <div id="timer5KDisplay" class="timer-digits">00:00:00</div>
    </div>

    <!-- BAGIAN BAWAH: KATEGORI 10K -->
    <div class="race-sector sector-10k">
      <div id="label10K" class="category-badge badge-10k">10K</div>
      <div id="timer10KDisplay" class="timer-digits">00:00:00</div>
    </div>
  </div>

  <script>
    let socket = null;
    try {
      socket = io();
    } catch (e) {
      console.warn("Socket.IO tidak terhubung secara langsung:", e);
    }

    let race5K = null;
    let race10K = null;
    let systemState = null;

    function formatHHMMSS(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function calculateElapsed(race, nowMs) {
      if (!race || race.status === 'idle' || race.status === 'armed' || !race.startedAt) return 0;
      if (race.status === 'finished' && race.finishedElapsedMs !== null) return Math.max(0, race.finishedElapsedMs);
      if (race.status === 'paused' && race.pausedAt) {
        return Math.max(0, race.pausedAt - race.startedAt - race.accumulatedPauseMs + race.adjustmentMs);
      }
      if (race.status === 'finished' && race.finishedAt) {
        return Math.max(0, race.finishedAt - race.startedAt - race.accumulatedPauseMs + race.adjustmentMs);
      }
      return Math.max(0, nowMs - race.startedAt - race.accumulatedPauseMs + race.adjustmentMs);
    }

    function applyVisualEffectsToElement(timerEl, labelEl, ds) {
      if (!ds) return;

      timerEl.style.color = ds.textColor || '#FFFFFF';

      if (ds.strokeWidth && ds.strokeWidth > 0) {
        timerEl.style.webkitTextStroke = `${ds.strokeWidth}px ${ds.strokeColor || '#000000'}`;
      } else {
        timerEl.style.webkitTextStroke = '0px transparent';
      }

      const shadows = [];
      if (ds.shadowBlur && ds.shadowBlur > 0) {
        shadows.push(`4px 6px ${ds.shadowBlur}px ${ds.shadowColor || '#000000'}`);
      }
      if (ds.glowBlur && ds.glowBlur > 0) {
        shadows.push(`0 0 ${ds.glowBlur}px ${ds.glowColor || '#00FFFF'}`);
        shadows.push(`0 0 ${Math.round(ds.glowBlur * 1.5)}px ${ds.glowColor || '#00FFFF'}`);
      }
      timerEl.style.textShadow = shadows.length > 0 ? shadows.join(', ') : 'none';

      const fontMap = {
        'Orbitron':     "'Orbitron', monospace",
        'Bebas Neue':   "'Bebas Neue', cursive",
        'Rajdhani':     "'Rajdhani', sans-serif",
        'Roboto Mono':  "'Roboto Mono', monospace",
        'Share Tech Mono': "'Share Tech Mono', monospace",
        'Chakra Petch': "'Chakra Petch', sans-serif",
        'Exo 2':        "'Exo 2', sans-serif",
        'Black Ops One':"'Black Ops One', cursive",
      };
      const selectedFont = fontMap[ds.fontFamily] || fontMap['Orbitron'];
      timerEl.style.fontFamily = selectedFont;
      if (labelEl) labelEl.style.fontFamily = selectedFont;

      if (ds.scalePercent) {
        timerEl.style.transform = `scale(${ds.scalePercent / 100})`;
      }
    }

    function renderLoop() {
      const timer5KEl = document.getElementById('timer5KDisplay');
      const timer10KEl = document.getElementById('timer10KDisplay');
      const label5KEl = document.getElementById('label5K');
      const label10KEl = document.getElementById('label10K');
      const bodyEl = document.getElementById('chromaBody');

      if (systemState) {
        const ds = systemState.displaySettings;
        if (ds) {
          bodyEl.style.backgroundColor = ds.chromaColor || '#00FF00';

          if (ds.hideCursor) {
            bodyEl.classList.add('hide-cursor');
          } else {
            bodyEl.classList.remove('hide-cursor');
          }

          const showLabel = ds.showLabel !== false;
          label5KEl.style.display = showLabel ? 'block' : 'none';
          label10KEl.style.display = showLabel ? 'block' : 'none';

          applyVisualEffectsToElement(timer5KEl, label5KEl, ds);
          applyVisualEffectsToElement(timer10KEl, label10KEl, ds);
        }

        if (systemState.chromaTestOnly) {
          timer5KEl.style.display = 'none';
          timer10KEl.style.display = 'none';
          label5KEl.style.display = 'none';
          label10KEl.style.display = 'none';
          requestAnimationFrame(renderLoop);
          return;
        } else {
          timer5KEl.style.display = 'block';
          timer10KEl.style.display = 'block';
        }

        if (systemState.testPattern && systemState.testPattern !== 'none') {
          timer5KEl.innerText = systemState.testPattern;
          timer10KEl.innerText = systemState.testPattern;
          requestAnimationFrame(renderLoop);
          return;
        }
      }

      const nowMs = Date.now();
      if (race5K) {
        const elapsed5K = calculateElapsed(race5K, nowMs);
        timer5KEl.innerText = formatHHMMSS(elapsed5K);
      }
      if (race10K) {
        const elapsed10K = calculateElapsed(race10K, nowMs);
        timer10KEl.innerText = formatHHMMSS(elapsed10K);
      }

      requestAnimationFrame(renderLoop);
    }

    if (socket) {
      socket.on('STATE_UPDATE', (data) => {
        if (data && data.races) {
          race5K = data.races['5k'];
          race10K = data.races['10k'];
          systemState = data.system;
        }
      });
      socket.emit('GET_STATE');
    }

    renderLoop();
  </script>
</body>
</html>
